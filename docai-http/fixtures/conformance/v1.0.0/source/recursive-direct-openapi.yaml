openapi: 3.1.1
info:
  title: Stable Conformance Direct Recursive Fixture
  version: 1.0.0-conformance-recursive-direct-source
paths:
  /nodes/{id}:
    get:
      operationId: getNode
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Directly recursive node.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Node"
components:
  schemas:
    Node:
      type: object
      required:
        - id
      properties:
        id:
          type: string
        children:
          type: array
          items:
            $ref: "#/components/schemas/Node"
