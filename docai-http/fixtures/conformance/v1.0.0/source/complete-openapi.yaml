openapi: 3.1.1
info:
  title: Stable Conformance Fixture API
  version: 1.0.0-conformance-source
x-source-revision: fixture-openapi-rc3-001
paths:
  /users:
    post:
      summary: Create user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - email
                - name
              properties:
                email:
                  type: string
                  format: email
                  x-docai-email-syntax: RFC 5322
                  x-docai-unique-scope: all tenants
                name:
                  type: string
                  minLength: 1
                  maxLength: 100
                role:
                  type: string
                  default: member
                  enum:
                    - admin
                    - member
      responses:
        "201":
          description: User created
          x-docai-body-presence: always
          headers:
            Location:
              required: true
              description: URL of the created user.
              schema:
                type: string
              example: /users/usr_01K0COMPLETE
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
              example:
                id: usr_01K0COMPLETE
                email: taro@example.com
                name: Taro Yamada
                role: member
                created_at: "2026-07-10T03:00:00Z"
        "409":
          description: Email already exists or the idempotency key conflicts.
          x-docai-body-presence: always
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/EmailTakenError"
                  - $ref: "#/components/schemas/StandardError"
        "422":
          $ref: "#/components/responses/ValidationError"
  /users/{id}:
    get:
      summary: Get user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: User
          x-docai-body-presence: always
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
              example:
                id: usr_01K0COMPLETE
                email: taro@example.com
                name: Taro Yamada
                role: member
                created_at: "2026-07-10T03:00:00Z"
  /carts/{id}/validate:
    post:
      summary: Validate cart
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Cart validated
          x-docai-body-presence: always
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CartValidationResponse"
              example:
                cart_id: cart_01K0COMPLETE
                status: validated
  /payments:
    post:
      summary: Create payment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/CardPaymentRequest"
                - $ref: "#/components/schemas/BankPaymentRequest"
              discriminator:
                propertyName: type
      responses:
        "201":
          description: Payment created
          x-docai-body-presence: always
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentResponse"
              example:
                payment_id: pay_01K0COMPLETE
                status: pending
        "409":
          $ref: "#/components/responses/IdempotencyConflict"
      x-docai-triggers:
        - payment.completed
  /orders:
    post:
      summary: Confirm order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - cart_id
                - payment_id
              properties:
                cart_id:
                  type: string
                payment_id:
                  type: string
      responses:
        "201":
          description: Order confirmed
          x-docai-body-presence: always
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderResponse"
              example:
                order_id: ord_01K0COMPLETE
                status: confirmed
        "409":
          $ref: "#/components/responses/IdempotencyConflict"
  /documents:
    post:
      summary: Upload document
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required:
                - document
              properties:
                document:
                  type: string
                  format: binary
                metadata:
                  $ref: "#/components/schemas/DocumentMetadata"
            encoding:
              document:
                contentType: application/pdf, image/png
              metadata:
                contentType: application/json
      responses:
        "201":
          description: Document uploaded
          x-docai-body-presence: always
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentUploadResponse"
              example:
                document_id: doc_01K0COMPLETE
                status: uploaded
        "409":
          $ref: "#/components/responses/IdempotencyConflict"
        "422":
          $ref: "#/components/responses/ValidationError"
webhooks:
  payment.completed:
    post:
      summary: Payment completed
      parameters:
        - name: X-Payment-Attempt
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - event_id
                - event
                - payment_id
                - amount
                - occurred_at
                - metadata
              properties:
                event_id:
                  type: string
                event:
                  type: string
                  enum:
                    - payment.completed
                payment_id:
                  type: string
                amount:
                  type: integer
                  minimum: 1
                  x-docai-currency: JPY
                occurred_at:
                  type: string
                  format: date-time
                metadata:
                  type: object
                  additionalProperties: false
                  required:
                    - processor_trace
                  properties:
                    processor_trace:
                      type: string
                  x-docai-opaque: true
x-docai-workflows:
  checkout:
    endpoints:
      - POST /carts/{id}/validate
      - POST /payments
      - POST /orders
components:
  responses:
    TokenExpired:
      description: Access token has expired.
      x-docai-body-presence: always
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/StandardError"
          example:
            error:
              code: token_expired
              message: access token expired
    Forbidden:
      description: Credential lacks permission.
      x-docai-body-presence: always
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/StandardError"
    ServerError:
      description: Unexpected server failure.
      x-docai-body-presence: always
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/StandardError"
    IdempotencyConflict:
      description: The idempotency key was reused with different request content.
      x-docai-body-presence: always
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/StandardError"
    ValidationError:
      description: Request validation failed.
      x-docai-body-presence: always
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationError"
          example:
            error:
              code: validation_failed
              message: input is invalid
              field_errors:
                - field: name
                  code: too_long
                  message: name is too long
  schemas:
    User:
      type: object
      additionalProperties: false
      required:
        - id
        - email
        - name
        - role
        - created_at
      properties:
        id:
          type: string
        email:
          type: string
          format: email
          x-docai-email-syntax: RFC 5322
          x-docai-unique-scope: all tenants
        name:
          type: string
          minLength: 1
          maxLength: 100
        role:
          type: string
          default: member
          enum:
            - admin
            - member
        created_at:
          type: string
          format: date-time
    CartValidationResponse:
      type: object
      additionalProperties: false
      required:
        - cart_id
        - status
      properties:
        cart_id:
          type: string
        status:
          type: string
          const: validated
    PaymentResponse:
      type: object
      additionalProperties: false
      required:
        - payment_id
        - status
      properties:
        payment_id:
          type: string
        status:
          type: string
          const: pending
    OrderResponse:
      type: object
      additionalProperties: false
      required:
        - order_id
        - status
      properties:
        order_id:
          type: string
        status:
          type: string
          const: confirmed
    DocumentUploadResponse:
      type: object
      additionalProperties: false
      required:
        - document_id
        - status
      properties:
        document_id:
          type: string
        status:
          type: string
          const: uploaded
    DocumentMetadata:
      type: object
      additionalProperties: false
      properties:
        title:
          type: string
        tags:
          type: array
          items:
            type: string
    StandardError:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          type: object
          additionalProperties: false
          required:
            - code
            - message
          properties:
            code:
              type: string
            message:
              type: string
    EmailTakenError:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          type: object
          additionalProperties: false
          required:
            - code
            - message
          properties:
            code:
              type: string
              const: email_taken
            message:
              type: string
    ValidationError:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          type: object
          additionalProperties: false
          required:
            - code
            - message
            - field_errors
          properties:
            code:
              type: string
              const: validation_failed
            message:
              type: string
            field_errors:
              type: array
              items:
                type: object
                additionalProperties: false
                required:
                  - field
                  - code
                  - message
                properties:
                  field:
                    type: string
                  code:
                    type: string
                  message:
                    type: string
    CardPaymentRequest:
      type: object
      additionalProperties: false
      required:
        - type
        - cart_id
        - amount
        - currency
        - card_token
      properties:
        type:
          const: card
        cart_id:
          type: string
        amount:
          type: integer
          minimum: 1
        currency:
          type: string
          enum:
            - JPY
            - USD
        card_token:
          type: string
    BankPaymentRequest:
      type: object
      additionalProperties: false
      required:
        - type
        - cart_id
        - amount
        - currency
        - bank_account_id
      properties:
        type:
          const: bank
        cart_id:
          type: string
        amount:
          type: integer
          minimum: 1
        currency:
          type: string
          enum:
            - JPY
            - USD
        bank_account_id:
          type: string
