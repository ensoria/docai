openapi: 3.1.1
info:
  title: Polymorphism Candidate Fixture API
  version: 0.11.0-polymorphism-candidate-source
paths:
  /customers/{id}/signals:
    get:
      summary: Get customer signals with overlapping response variants
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Customer signals
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/CombinedCustomerSignals"
                  - $ref: "#/components/schemas/ChurnRiskSignal"
                  - $ref: "#/components/schemas/HighValueSignal"
              x-docai-combination:
                description: high_value and churn_risk may both be true for the same customer; document a combined variant.
  /payment-methods/{id}:
    get:
      summary: Get payment method with untagged response variants
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Payment method
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/BankPaymentMethod"
                  - $ref: "#/components/schemas/CardPaymentMethod"
  /payments:
    post:
      summary: Create payment with tagged request variants
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/BankPaymentRequest"
                - $ref: "#/components/schemas/CardPaymentRequest"
              discriminator:
                propertyName: type
                mapping:
                  bank: "#/components/schemas/BankPaymentRequest"
                  card: "#/components/schemas/CardPaymentRequest"
      responses:
        "201":
          description: Payment created
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - payment_id
                  - status
                properties:
                  payment_id:
                    type: string
                  status:
                    type: string
                    enum:
                      - pending
components:
  schemas:
    CombinedCustomerSignals:
      type: object
      additionalProperties: false
      required:
        - customer_id
        - high_value
        - lifetime_value
        - churn_risk
        - churn_probability
      properties:
        customer_id:
          type: string
        high_value:
          type: boolean
          const: true
        lifetime_value:
          type: integer
          minimum: 0
        churn_risk:
          type: boolean
          const: true
        churn_probability:
          type: number
          minimum: 0
          maximum: 1
    ChurnRiskSignal:
      type: object
      additionalProperties: false
      required:
        - customer_id
        - churn_risk
        - churn_probability
      properties:
        customer_id:
          type: string
        churn_risk:
          type: boolean
          const: true
        churn_probability:
          type: number
          minimum: 0
          maximum: 1
    HighValueSignal:
      type: object
      additionalProperties: false
      required:
        - customer_id
        - high_value
        - lifetime_value
      properties:
        customer_id:
          type: string
        high_value:
          type: boolean
          const: true
        lifetime_value:
          type: integer
          minimum: 0
    BankPaymentMethod:
      type: object
      additionalProperties: false
      required:
        - id
        - label
        - bank_account_id
      properties:
        id:
          type: string
        label:
          type: string
        bank_account_id:
          type: string
    CardPaymentMethod:
      type: object
      additionalProperties: false
      required:
        - id
        - label
        - card_last4
      properties:
        id:
          type: string
        label:
          type: string
        card_last4:
          type: string
    BankPaymentRequest:
      type: object
      additionalProperties: false
      required:
        - type
        - amount
        - currency
        - bank_account_id
      properties:
        type:
          type: string
          enum:
            - bank
        amount:
          type: integer
          minimum: 1
        currency:
          type: string
          enum:
            - JPY
            - USD
        bank_account_id:
          type: string
    CardPaymentRequest:
      type: object
      additionalProperties: false
      required:
        - type
        - amount
        - currency
        - card_token
      properties:
        type:
          type: string
          enum:
            - card
        amount:
          type: integer
          minimum: 1
        currency:
          type: string
          enum:
            - JPY
            - USD
        card_token:
          type: string
