openapi: 3.1.1
info:
  title: Non-JSON Candidate Fixture API
  version: 0.11.0-non-json-candidate-source
paths:
  /reports/export:
    get:
      summary: Export reports CSV
      responses:
        "200":
          description: Reports CSV export
          headers:
            Content-Disposition:
              description: Attachment filename for the CSV export.
              schema:
                type: string
          content:
            text/csv:
              schema:
                type: string
              x-docai-csv:
                charset: UTF-8
                delimiter: ","
                record_separator: CRLF
                header: present
                quote: "\""
                escape: "\"\""
                columns:
                  - report_id
                  - title
                  - total
  /avatars/{id}/image:
    put:
      summary: Upload avatar image
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          image/png:
            schema:
              type: string
              format: binary
            x-docai-max-size: 2097152
            x-docai-integrity-header: Digest
      responses:
        "204":
          description: Avatar image stored
    get:
      summary: Download avatar image
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Avatar image
          headers:
            Content-Disposition:
              description: Attachment filename for the image.
              schema:
                type: string
            Content-Length:
              description: Image size in bytes.
              schema:
                type: integer
            Digest:
              description: SHA-256 digest of the response body bytes.
              schema:
                type: string
          content:
            image/png:
              schema:
                type: string
                format: binary
              x-docai-max-size: 2097152
  /reports/search:
    post:
      summary: Search reports
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            encoding:
              q:
                x-docai-charset: UTF-8
                x-docai-space-encoding: plus
              tag:
                style: form
                explode: true
                x-docai-repeated-field: repeat key once per value; order not significant
              include_archived:
                x-docai-values:
                  - "true"
                  - "false"
            schema:
              type: object
              additionalProperties: false
              required:
                - q
              properties:
                q:
                  type: string
                  minLength: 1
                tag:
                  type: array
                  items:
                    type: string
                include_archived:
                  type: boolean
                  default: false
      responses:
        "200":
          description: Matching reports
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - results
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required:
                        - report_id
                        - title
                      properties:
                        report_id:
                          type: string
                        title:
                          type: string
  /documents:
    post:
      summary: Upload document
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required:
                - document
              properties:
                document:
                  type: string
                  format: binary
                  description: PDF or PNG file, maximum 10 MiB.
                metadata:
                  type: object
                  additionalProperties: false
                  properties:
                    title:
                      type: string
                    tags:
                      type: array
                      items:
                        type: string
            encoding:
              document:
                contentType: application/pdf, image/png
                x-docai-filename: required; preserve extension
                x-docai-max-size: 10485760
              metadata:
                contentType: application/json
                x-docai-max-size: 4096
      responses:
        "201":
          description: Document uploaded
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - document_id
                  - status
                properties:
                  document_id:
                    type: string
                  status:
                    type: string
                    enum:
                      - uploaded
